<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a2e;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      .sim-help {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.7);
        color: #dfe6f5;
        font: 13px/1.6 system-ui, sans-serif;
        border-radius: 8px;
        pointer-events: none;
      }
      .sim-help kbd {
        background: #333a4d;
        border-radius: 4px;
        padding: 0 5px;
        font: 12px ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
